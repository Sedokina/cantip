name: Release

# Publish both packages to npm when a v* tag is pushed (e.g. `git tag v0.1.1 &&
# git push --tags`). A verify job checks the release notes, builds + serves the
# example first; publish only runs if that passes. A GitHub Release with the
# version's CHANGELOG.md section is created after the npm publish. Auth uses npm OIDC trusted publishing — no NPM_TOKEN
# secret. (Configure each package's trusted publisher on npmjs.com once, after the
# first manual publish; OIDC cannot create a brand-new package.)

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails before anything is built or published when CHANGELOG.md has no
      # section for this tag.
      - name: Check release notes
        run: node .github/scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /dev/null

      # Builds the engine dist/ via the workspace postinstall, links the example.
      - run: npm ci

      - name: Type-check engine
        run: npm run typecheck

      # Build the scaffold-generated example end-to-end (generate + Remix build).
      - name: Build example
        run: npm run build:starter

      # Smoke-test the built server actually serves the sample page. Run via
      # `npm run -w` (not a bin path) since the cantip bin is hoisted to the
      # workspace root; -w also sets cwd to examples/starter so `cantip start`
      # finds the build there.
      - name: Serve & smoke-test
        run: |
          PORT=3000 npm run start -w examples/starter &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -fsS "http://localhost:3000/intro/" >/dev/null && break
            sleep 1
          done
          curl -fsS "http://localhost:3000/intro/" | grep -q "Welcome to your docs"
          kill $SERVER_PID

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Required for npm OIDC trusted publishing (tokenless + provenance).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # npm >= 11.5 is required for OIDC trusted publishing.
      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      # Builds dist/ (postinstall) so the engine tarball is complete.
      - run: npm ci

      # Publish from each package's own directory (bare `npm publish`, NOT
      # `-w`): OIDC trusted publishing + provenance resolve the package from the
      # cwd, and the workspace flag can confuse that resolution. prepublishOnly
      # rebuilds dist/ for each; provenance is implied under OIDC.
      - name: Publish cantip
        working-directory: packages/cantip
        run: npm publish

      - name: Publish create-cantip
        working-directory: packages/create-cantip
        run: npm publish

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, to find the previous release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write release notes
        run: |
          node .github/scripts/changelog-section.mjs "$GITHUB_REF_NAME" > notes.md
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full changelog:** %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$GITHUB_REF_NAME" >> notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
